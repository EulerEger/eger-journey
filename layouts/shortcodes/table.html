{{ $file := .Page.Resources.GetMatch (.Get "src") }}
{{ if $file }}
{{ $data := transform.Unmarshal $file.Content }}
<table>
<thead>
<tr>
{{ range index $data 0 }}
  <th>{{ . }}</th>
{{ end }}
</tr>
</thead>
<tbody>
{{ range after 1 $data }}
<tr>
  {{ range . }}
  <td>{{ . }}</td>
  {{ end }}
</tr>
{{ end }}
</tbody>
</table>
{{ end }}
