# ============================================================
# Core Site Configuration
# ============================================================

baseURL: "https://eger-journey.github.io/"
title: "Eger's Journey"

languageCode: "en-us"
title: "repo-name"
theme: "PaperMod"

enableRobotsTXT: true

# Production builds only
buildDrafts: false
buildFuture: false
buildExpired: false


# ============================================================
# Pagination
# ============================================================

pagination:
  pagerSize: 10
  path: "page"


# ============================================================
# PaperMod
# ============================================================

params:
  env: "production"

  author: "E-GER"
  description: "The journey of a curious mind eager to better understand the inner workings of the universe."

  # Appearance
  defaultTheme: "auto"
  disableThemeToggle: false

  # Posts
  ShowReadingTime: true
  ShowToc: true
  TocOpen: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true

  # Homepage
  homeInfoParams:
    Title: "Scientific Notes & Explorations"
    Content: "A self-hosted science and technology blog dedicated to clear explanations, rigorous reasoning, and long-term maintainability."

  # Mathematics
  math: true

  # Citation
  citation:
    style: "apa"


# ============================================================
# Navigation
# ============================================================

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10

    - identifier: about
      name: About
      url: /about/
      weight: 20

    - identifier: posts
      name: Journal
      url: /posts/
      weight: 30

    - identifier: resources
      name: Resources
      url: /resources/
      weight: 40

    - identifier: contact
      name: Contact
      url: /contact/
      weight: 50

    - identifier: search
      name: Search
      url: /search/
      weight: 60


# ============================================================
# Taxonomies
# ============================================================

taxonomies:
  category: categories
  tag: tags
  series: series


# ============================================================
# Markup & Rendering
# ============================================================

markup:
  goldmark:
    renderer:
      unsafe: false

  highlight:
    noClasses: false
    style: "monokai"
    lineNos: true

  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false


# ============================================================
# Privacy / Tracking Protection
# ============================================================

privacy:
  googleAnalytics:
    disable: true

  youtube:
    privacyEnhanced: true

  vimeo:
    enableDNT: true

  x:
    disable: true


# ============================================================
# Output Formats
# ============================================================

outputs:
  home:
    - HTML
    - RSS
    - JSON

  section:
    - HTML
    - RSS

  taxonomy:
    - HTML


# ============================================================
# Security
# ============================================================

security:
  enableInlineShortcodes: true


# ============================================================
# Build / Performance
# ============================================================

build:
  writeStats: true
  useResourceCacheWhen: fallback


# ============================================================
# Minification
# ============================================================

minify:
  disableHTML: false
  disableCSS: false
  disableJS: false
  disableXML: true
  minifyOutput: true
